[pytest]
testpaths = testcases
python_files = test_*.py test.py *_test.py
addopts = -q --strict-markers
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s %(levelname)s [%(name)s] %(message)s
markers =
    smoke: core smoke cases
    ui: ui automation cases
    labels(*tags): excel labels binding (e.g. smoke, auth, order)
    unstable: 环境敏感的偶发失败用例，需要自动重试
    flaky: rerun marker consumed by pytest-rerunfailures
